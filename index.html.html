<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Household</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F6F5;
    --surface: #FFFFFF;
    --ink: #14262C;
    --muted: #55696F;
    --line: #D9E3E1;
    --accent: #1B7A6B;
    --accent-ink: #FFFFFF;
    --sun: #F1B942;
    --sun-ink: #2B2100;
    --night: #2E4A66;
    --night-ink: #FFFFFF;
    --warn: #B7391F;
    --warn-bg: #FBE9E4;
    --ok-bg: #E3F1EE;
    --chip-bg: #E7EDEC;
    --a-baby: #D9A128;
    --a-cal: #2F6FB5;
    --a-meal: #C4692A;
    --a-stock: #7B5CC4;
    --a-chore: #1B7A6B;
    --a-bill: #B0507F;
    --a-admin: #6B7A80;
    --a-smart: #2E4A66;
    --shadow: 0 1px 2px rgba(20,38,44,.06);
    --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1B1F; --surface: #17272C; --ink: #E8F1EF; --muted: #97ABB0; --line: #27393F;
      --accent: #3FB5A2; --accent-ink: #08201C; --sun: #E8B23E; --sun-ink: #241B00;
      --night: #6E97C0; --night-ink: #0B1824; --warn: #F08466; --warn-bg: #3A2019; --ok-bg: #16332E; --chip-bg: #22343A;
      --a-baby: #E8B23E; --a-cal: #6FA3E0; --a-meal: #E8935A; --a-stock: #A48CE6; --a-chore: #3FB5A2; --a-bill: #E27FAE; --a-admin: #93A8AD; --a-smart: #6E97C0;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1B1F; --surface: #17272C; --ink: #E8F1EF; --muted: #97ABB0; --line: #27393F;
    --accent: #3FB5A2; --accent-ink: #08201C; --sun: #E8B23E; --sun-ink: #241B00;
    --night: #6E97C0; --night-ink: #0B1824; --warn: #F08466; --warn-bg: #3A2019; --ok-bg: #16332E; --chip-bg: #22343A;
    --a-baby: #E8B23E; --a-cal: #6FA3E0; --a-meal: #E8935A; --a-stock: #A48CE6; --a-chore: #3FB5A2; --a-bill: #E27FAE; --a-admin: #93A8AD; --a-smart: #6E97C0;
    --shadow: none;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 16px; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 480px; margin: 0 auto; padding: 20px 18px 110px; }

  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .date { color: var(--muted); font-size: 15px; margin: 0 0 2px; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.02em; }
  .theme { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
  .summary { margin: 10px 0 24px; }
  .summary .big { font-family: var(--font-display); font-weight: 500; font-size: 20px; line-height: 1.25; margin: 0; }
  .summary .small { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
  .retry { margin-top: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; }

  h2 { font-family: var(--font-display); font-weight: 700; font-size: 20px; margin: 0 0 10px; letter-spacing: -0.01em; }
  section { margin-bottom: 28px; }

  .log { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .log button {
    border: 0; border-radius: 20px; min-height: 104px; padding: 14px 10px;
    display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left;
    transition: transform .12s ease;
  }
  .log button:active { transform: scale(.97); }
  .log .name { font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .log .last { font-size: 13px; font-weight: 500; opacity: .9; }
  .b-feed  { background: var(--accent); color: var(--accent-ink); }
  .b-nappy { background: var(--sun);    color: var(--sun-ink); }
  .b-sleep { background: var(--night);  color: var(--night-ink); }
  .use-btn {
    width: 100%; border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 10px;
    background: var(--surface); font-weight: 600; font-size: 16px; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
  }
  .use-btn span:last-child { color: var(--muted); font-weight: 500; font-size: 14px; }

  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c, var(--line));
    border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
  }
  .row .time { font-family: var(--font-display); font-weight: 700; min-width: 48px; }
  .row .main { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .sub { color: var(--muted); font-size: 14px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--chip-bg); color: var(--muted); white-space: nowrap; }
  .tag.ok { background: var(--ok-bg); color: var(--accent); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }

  .tick { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
  .tick svg { width: 16px; height: 16px; stroke: var(--accent-ink); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .done .tick { background: var(--accent); border-color: var(--accent); }
  .done .tick svg { opacity: 1; }
  .done .title { text-decoration: line-through; color: var(--muted); }

  .hl .area { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 1px; }
  .hl .title { font-size: 16px; }
  .empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 14px; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  nav button { background: none; border: 0; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: var(--muted); border-radius: 12px; }
  nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .scrim { position: fixed; inset: 0; background: rgba(8,20,24,.5); z-index: 30; display: none; }
  .scrim.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 82%;
    background: var(--bg); border-radius: 24px 24px 0 0; display: none; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sheet.open { display: flex; }
  .sheet .inner { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }
  .sheet header { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 8px; }
  .sheet header h2 { margin: 0; font-size: 22px; }
  .sheet header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .close { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; }
  .sheet .body { overflow-y: auto; padding: 8px 18px 22px; }
  .item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 8px; }
  .item .nm { flex: 1; font-weight: 600; }
  .item .qty { color: var(--muted); font-size: 14px; }
  .item .qty.low { color: var(--warn); font-weight: 600; }
  .item .act { font-weight: 600; color: var(--accent); }
  .item[disabled] { opacity: .6; cursor: default; }


  /* Stock page */
  .page { position: fixed; inset: 0; z-index: 25; background: var(--bg); overflow-y: auto; display: none;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .page.open { display: block; }
  .pinner { max-width: 480px; margin: 0 auto; padding: 14px 18px 60px; }
  .phead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 8px; }
  .phead h2 { margin: 0; text-align: center; font-size: 22px; }
  .phead .pbtn:first-child { justify-self: start; }
  .phead .pbtn:last-child { justify-self: end; }
  .pbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 15px; }
  .pbtn.strong { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .psum { color: var(--muted); margin: 0 0 12px; text-align: center; }
  .ptools { display: flex; gap: 8px; margin-bottom: 10px; }
  .search { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .srow { padding: 10px 10px 10px 14px; gap: 10px; }
  .smain { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; display: block; }
  .stop { display: flex; align-items: center; gap: 8px; }
  .bar { position: relative; height: 6px; background: var(--chip-bg); border-radius: 999px; margin-top: 8px; }
  .fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .fill.low { background: var(--warn); }
  .mark { position: absolute; top: -3px; width: 2px; height: 12px; background: var(--ink); opacity: .55; border-radius: 1px; }
  .step { display: flex; align-items: center; gap: 4px; flex: none; }
  .stepbtn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 600; line-height: 1; }
  .sqty { min-width: 44px; text-align: center; }
  .sq-n { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .sq-u { font-size: 12px; color: var(--muted); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .field input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; }
  .field .hint { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .formbtns { display: grid; gap: 10px; margin-top: 8px; }
  .savebtn { border: 0; border-radius: 14px; padding: 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 17px; }
  .savebtn[disabled] { opacity: .6; }
  .delbtn { border: 1px solid var(--warn); background: transparent; color: var(--warn); border-radius: 14px; padding: 12px; font-weight: 600; }

  .field select { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; }
  .sechead { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--muted); margin: 8px 2px 0; }
  .sechead:first-child { margin-top: 0; }
  .tickbtn { width: 34px; height: 34px; border-radius: 10px; background: none; padding: 0; }
  .done .tickbtn { background: var(--accent); }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--chip-bg); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
  .segbtn { border: 0; background: none; border-radius: 10px; padding: 9px 4px; font-weight: 600; font-size: 15px; color: var(--muted); }
  .segbtn.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .stat strong { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
  .stat span { color: var(--muted); font-size: 13px; }
  .chart { width: 100%; height: auto; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
  .row.dim { opacity: .65; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; font-weight: 500;
    z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s ease; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <p class="date" id="date"></p>
      <h1 id="greet">Hello</h1>
    </div>
    <button class="theme" id="theme" aria-label="Switch light or dark mode">Theme</button>
  </div>

  <div class="summary" id="summary" aria-live="polite"><p class="big">Loading your household…</p></div>

  <section aria-labelledby="h-log">
    <h2 id="h-log">Quick log</h2>
    <div class="log">
      <button class="b-feed" data-log="Feed"><span class="name">Feed</span><span class="last" id="last-feed">…</span></button>
      <button class="b-nappy" data-log="Nappy"><span class="name">Nappy</span><span class="last" id="last-nappy">…</span></button>
      <button class="b-sleep" data-log="Sleep"><span class="name">Sleep</span><span class="last" id="last-sleep">…</span></button>
    </div>
    <button class="use-btn" id="use-btn"><span>Used something around the house?</span><span>Log it</span></button>
  </section>

  <section aria-labelledby="h-today">
    <h2 id="h-today">Today</h2>
    <ul class="rows" id="today"></ul>
  </section>

  <section aria-labelledby="h-hl">
    <h2 id="h-hl">Across the house</h2>
    <ul class="rows" id="highlights"></ul>
  </section>
</div>

<nav aria-label="Main">
  <div class="in">
    <button aria-current="page" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</button>
    <button data-nav="stock"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Stock</button>
    <button data-nav="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Calendar</button>
    <button data-nav="baby"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.5-7 10-7 10z"/></svg>Baby</button>
    <button data-nav="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </div>
</nav>

<div class="page" id="stock-page" role="dialog" aria-modal="true" aria-label="Stock">
  <div class="pinner">
    <div class="phead">
      <button class="pbtn" id="stock-back">Back</button>
      <h2>Stock</h2>
      <button class="pbtn strong" id="stock-add">Add item</button>
    </div>
    <p class="psum" id="stock-summary"></p>
    <div class="ptools">
      <input class="search" id="stock-search" type="search" placeholder="Search items" aria-label="Search items">
      <button class="pbtn" id="stock-shop">Shopping list</button>
    </div>
    <div class="chips" id="stock-chips"></div>
    <ul class="rows" id="stock-list"></ul>
  </div>
</div>

<div class="page" id="chores-page" role="dialog" aria-modal="true" aria-label="Chores">
  <div class="pinner">
    <div class="phead">
      <button class="pbtn" id="chores-back">Back</button>
      <h2>Chores</h2>
      <button class="pbtn strong" id="chores-add">Add chore</button>
    </div>
    <p class="psum" id="chores-summary"></p>
    <div class="chips" id="chores-chips"></div>
    <ul class="rows" id="chores-list"></ul>
  </div>
</div>

<div class="page" id="bills-page" role="dialog" aria-modal="true" aria-label="Bills">
  <div class="pinner">
    <div class="phead">
      <button class="pbtn" id="bills-back">Back</button>
      <h2>Bills</h2>
      <button class="pbtn strong" id="bills-add">Add bill</button>
    </div>
    <p class="psum" id="bills-summary"></p>
    <ul class="rows" id="bills-list"></ul>
  </div>
</div>

<div class="page" id="baby-page" role="dialog" aria-modal="true" aria-label="Baby">
  <div class="pinner">
    <div class="phead">
      <button class="pbtn" id="baby-back">Back</button>
      <h2>Baby</h2>
      <button class="pbtn strong" id="baby-add">Log earlier</button>
    </div>
    <div class="seg" id="baby-tabs"></div>
    <div id="baby-body"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="inner">
    <header>
      <div><h2 id="sheet-title"></h2><p id="sheet-sub"></p></div>
      <button class="close" id="close">Done</button>
    </header>
    <div class="body" id="sheet-body"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var S = null;          // all household data, loaded from the Google Sheet
  var mode = null, lastFocus = null;

  // ---------- Helpers ----------
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function isLow(i) { return i.qty <= i.low; }
  function lowItems() { return S.stock.filter(isLow); }
  function openChores() { return S.chores.filter(function (c) { return c.status === 'due'; }); }
  function ago(ms) {
    if (!ms) return 'Not yet';
    var m = Math.floor((Date.now() - ms) / 60000);
    if (m < 1) return 'Just now';
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60), r = m % 60;
    if (h >= 48) return Math.floor(h / 24) + ' days ago';
    return h + 'h' + (r ? ' ' + r + 'm' : '') + ' ago';
  }
  function agoText(ms) { return ms ? ago(ms) : 'not logged yet'; }
  function dueText(n) { return n < 0 ? 'overdue by ' + plural(-n, 'day', 'days') : n === 0 ? 'due today' : n === 1 ? 'due tomorrow' : 'due in ' + n + ' days'; }
  function ordinal(n) { var t = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (t[(v - 20) % 10] || t[v] || t[0]); }
  function choreLabel(c) {
    if (c.status === 'done') return 'Done today';
    if (c.status === 'later') return 'Due in ' + plural(c.dueIn, 'day', 'days');
    return (c.repeat !== 'Daily' && c.dueIn < 0) ? 'Overdue by ' + plural(-c.dueIn, 'day', 'days') : 'Due today';
  }
  function toggleChoreLocal(c) {
    c.done = !c.done; c.status = c.done ? 'done' : 'due'; if (!c.done) c.dueIn = 0;
    S.weekDone = Math.max(0, S.weekDone + (c.done ? 1 : -1));
    toast(c.done ? c.name + ': done' : c.name + ': back on the list');
    call('toggleChore', [c.name]);
  }
  function pageOpen() { return stockOpen || choresOpen || billsOpen || babyOpen; }
  function inDays(n) { return n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  function nextEvent() {
    var d = new Date(), mins = d.getHours() * 60 + d.getMinutes(), allDay = null;

      if (e.time === 'All day') { if (!allDay) allDay = e; continue; }
      var p = e.time.split(':');
      if (parseInt(p[0], 10) * 60 + parseInt(p[1], 10) > mins) return e;
    }
    return allDay;
  }

  // ---------- Sheet (use stock / shopping list / bills) ----------
  function openSheet(m) {

  function renderSheet() {

    if (mode === 'use') {

      if (!S.stock.length) { body.appendChild(el('div', 'empty', 'No items yet. Add them in the Stock tab of the Sheet.')); return; }
      S.stock.forEach(function (i) {
        var b = el('button', 'item'); b.appendChild(el('span', 'nm', i.item));
        b.appendChild(el('span', 'qty' + (isLow(i) ? ' low' : ''), i.qty + ' ' + i.unit));
        b.appendChild(el('span', 'act', 'Use 1'));
        b.addEventListener('click', function () {
          if (i.qty <= 0) { toast(i.item + ' is finished'); return; }

          renderSheet();

      });
    } else if (mode === 'shop') {
      var low = lowItems();
      $('sheet-title').textContent = 'Shopping list';
      $('sheet-sub').textContent = 'Items that ran low are added here automatically.';
      if (!low.length) { body.appendChild(el('div', 'empty', 'Nothing to buy. Everything is above its low-stock level.')); return; }
      low.forEach(function (i) {

        b.appendChild(el('span', 'qty', 'Buy ' + i.buy + ' ' + i.unit));
        b.appendChild(el('span', 'act', 'Bought'));

    } else if (mode === 'form') {

    } else if (mode === 'chore-form') {

    } else if (mode === 'baby-log-form') {
      buildLogForm(body);
    } else if (mode === 'entry-form') {
      buildEntryForm(body);
    } else if (mode === 'clinic-form') {
      buildClinicForm(body);
    } else if (mode === 'growth-form') {
      buildGrowthForm(body);
    } else if (mode === 'bills') {
      $('sheet-title').textContent = 'Bills this month';
      $('sheet-sub').textContent = 'Tap a bill once you have paid it.';
      if (!S.bills.length) { body.appendChild(el('div', 'empty', 'No bills yet. Add them in the Bills tab of the Sheet.')); return; }
      S.bills.slice().sort(function (a, b) { return (a.paid - b.paid) || (a.daysLeft - b.daysLeft); }).forEach(function (bl) {
        var b = el('button', 'item'); b.appendChild(el('span', 'nm', bl.name));

    if (e.key !== 'Escape') return;

  });

  // ---------- Stock page ----------
  var stockOpen = false, stockFilter = 'all', stockSearch = '', editing = null, formItem = null, lastFocusPage = null;

  function level(i) {
    var target = Math.max(i.qty, i.low + i.buy, i.low * 2, 1);
    return { pct: Math.min(100, Math.round(i.qty / target * 100)), mark: Math.min(100, Math.round(i.low / target * 100)) };
  }
  function errToast(err) { toast(((err && err.message) || 'Could not save').replace(/^(Error|Exception):\s*/, '')); }

  function openStock() {
    if (!S) return;
    stockOpen = true; stockFilter = 'all'; stockSearch = ''; $('stock-search').value = '';
    lastFocusPage = document.activeElement;
    $('stock-page').classList.add('open'); document.body.style.overflow = 'hidden';
    renderStockPage(); $('stock-back').focus();
  }
  function closeStock() {

    if (lastFocusPage && lastFocusPage.focus) lastFocusPage.focus();
  }
  function stockSummary() {

    $('stock-shop').textContent = 'Shopping list (' + n + ')';

  function renderStockPage() { stockSummary(); renderChips(); renderStockList(); }

  function renderChips() {
    var box = $('stock-chips'); box.innerHTML = '';
    var cats = []; S.stock.forEach(function (i) { if (cats.indexOf(i.category) < 0) cats.push(i.category); });
    cats.sort();
    if (stockFilter.indexOf('cat:') === 0 && cats.indexOf(stockFilter.slice(4)) < 0) stockFilter = 'all';
    var opts = [{ k: 'all', l: 'All' }, { k: 'low', l: 'Running low' }].concat(cats.map(function (c) { return { k: 'cat:' + c, l: c }; }));
    opts.forEach(function (o) {
      var b = el('button', 'chip' + (stockFilter === o.k ? ' on' : ''), o.l);
      b.setAttribute('aria-pressed', stockFilter === o.k ? 'true' : 'false');
      b.addEventListener('click', function () { stockFilter = o.k; renderChips(); renderStockList(); });
      box.appendChild(b);
    });
  }

  function renderStockList() {
    var ul = $('stock-list'); ul.innerHTML = '';
    var q = stockSearch.trim().toLowerCase();
    var items = S.stock.filter(function (i) {
      if (stockFilter === 'low' && !isLow(i)) return false;
      if (stockFilter.indexOf('cat:') === 0 && i.category !== stockFilter.slice(4)) return false;
      if (q && (i.item + ' ' + i.category).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) {
      return (isLow(b) - isLow(a)) || a.category.localeCompare(b.category) || a.item.localeCompare(b.item);
    });
    if (!items.length) {
      var li0 = el('li'); li0.appendChild(el('div', 'empty', S.stock.length ? 'No items match.' : 'No items yet. Tap Add item to start.')); ul.appendChild(li0); return;
    }
    items.forEach(function (i) { ul.appendChild(stockRow(i)); });

  function stockRow(i) {
    var li = el('li'), row = el('div', 'row srow');
    var main = el('button', 'smain'); main.setAttribute('aria-label', 'Edit ' + i.item);
    var top = el('div', 'stop'), tag = el('span', 'tag warn', 'Low');
    top.appendChild(el('span', 'title', i.item)); top.appendChild(tag);
    var bar = el('div', 'bar'), fill = el('div', 'fill'), mark = el('div', 'mark');
    bar.appendChild(fill); bar.appendChild(mark);
    main.appendChild(top); main.appendChild(el('div', 'sub', i.category)); main.appendChild(bar);
    main.addEventListener('click', function () { openForm(i.item); });

    var step = el('div', 'step');

    function refresh() {
      qn.textContent = i.qty;

      var fn = editing ? 'updateStockItem' : 'addStockItem', args = editing ? [editing, data] : [data];
      var r = google.script.run
        .withSuccessHandler(function () {
          var n = normItem(data);
          if (editing) {
            var t = S.stock.filter(function (x) { return x.item === editing; })[0];

        .withFailureHandler(function (err) { errToast(err); save.disabled = false; save.textContent = 'Save'; });

    var pts = items.filter(function (g) { return g.weight; }).map(function (g) { return { t: Date.parse(g.date), w: g.weight, d: g.date }; }).sort(function (a, b) { return a.t - b.t; });
    if (pts.length < 2) return '';
    var W = 320, H = 130, pl = 12, pr = 12, pt = 22, pb = 24;
    var ws = pts.map(function (p) { return p.w; }), minW = Math.min.apply(null, ws), maxW = Math.max.apply(null, ws);
    if (minW === maxW) { minW -= 0.5; maxW += 0.5; }
    var pad = (maxW - minW) * 0.2; minW -= pad; maxW += pad;
    var t0 = pts[0].t, span = (pts[pts.length - 1].t - t0) || 1;
    function x(t) { return pl + (t - t0) / span * (W - pl - pr); }
    function y(w) { return pt + (1 - (w - minW) / (maxW - minW)) * (H - pt - pb); }
    var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.w).toFixed(1); }).join(' ');
    var dots = pts.map(function (p) { return '<circle cx="' + x(p.t).toFixed(1) + '" cy="' + y(p.w).toFixed(1) + '" r="4" fill="var(--accent)"/>'; }).join('');
    var first = pts[0], last = pts[pts.length - 1];
    var lab = function (p, anchor) { return '<text x="' + x(p.t).toFixed(1) + '" y="' + (y(p.w) - 9).toFixed(1) + '" text-anchor="' + anchor + '" font-size="11" font-weight="600" fill="var(--ink)">' + p.w.toFixed(2).replace(/\.?0+$/, '') + ' kg</text>'; };
    var dt = function (p, anchor) { return '<text x="' + x(p.t).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '" font-size="10" fill="var(--muted)">' + fmtDate(p.d) + '</text>'; };
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight over time"><path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + dots + lab(first, 'start') + lab(last, 'end') + dt(first, 'start') + dt(last, 'end') + '</svg>';
  }
  function babyGrowth(box) {
    if (!B.growth.length) { box.appendChild(el('div', 'empty', 'No entries yet. Tap Add entry to record weight, length, or a note.')); return; }
    var chart = weightChart(B.growth);
    if (chart) { var holder = el('div'); holder.innerHTML = chart; box.appendChild(holder); }
    var ul = el('ul', 'rows');
    B.growth.slice().reverse().forEach(function (g) {
      var parts = [];
      if (g.weight) parts.push(g.weight + ' kg');
      if (g.height) parts.push(g.height + ' cm long');
      if (g.head) parts.push('head ' + g.head + ' cm');
      var li = el('li'), b = el('button', 'row'); b.style.setProperty('--c', 'var(--a-baby)');
      var m = el('div', 'main'); m.appendChild(el('div', 'title', fmtDate(g.date)));
      m.appendChild(el('div', 'sub', (parts.join(', ') || 'Note') + (g.note ? '. ' + g.note : '')));
      b.appendChild(m); b.addEventListener('click', function () { openGrowthForm(g); });
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  function openGrowthForm(g) { growthDraft = g; openSheet('growth-form'); }
  function buildGrowthForm(body) {
    var g = growthDraft;
    $('sheet-title').textContent = g ? 'Edit entry' : 'Add an entry';
    $('sheet-sub').textContent = 'Fill in what you measured. Leave the rest empty.';
    var dec = { step: 'any', inputmode: 'decimal' };
    body.appendChild(fieldEl('Date', 'g-date', 'date', g ? g.date : todayInput()));
    body.appendChild(fieldEl('Weight (kg)', 'g-weight', 'number', g && g.weight ? g.weight : '', '', dec));
    body.appendChild(fieldEl('Length or height (cm)', 'g-height', 'number', g && g.height ? g.height : '', '', dec));
    body.appendChild(fieldEl('Head size (cm)', 'g-head', 'number', g && g.head ? g.head : '', '', dec));
    body.appendChild(fieldEl('Note (optional)', 'g-note', 'text', g ? g.note : '', '', { placeholder: 'e.g. first smile, started solids', autocomplete: 'off' }));
    formButtons(body, {
      editing: g, addFn: 'addGrowth', updateFn: 'updateGrowth', deleteFn: 'deleteGrowth', deleteLabel: 'Delete entry',
      read: function () {
        var d = { date: $('g-date').value, weight: $('g-weight').value, height: $('g-height').value, head: $('g-head').value, note: $('g-note').value };
        if (!d.date) { toast('Please pick a date'); return null; }
        if (!d.weight && !d.height && !d.head && !d.note.trim()) { toast('Enter a measurement or a note'); return null; }
        return d;
      },
      updateArgs: function (d) { return [g.row, g.date, d]; },
      deleteArgs: function () { return [g.row, g.date]; },
      addedText: function () { return 'Entry added'; },
      deletedText: 'Entry deleted',
      after: function () { loadBaby(); }
    });
  }

  // ---------- Navigation (screens still to be built) ----------
  var labels = { baby: 'Baby screen', calendar: 'Calendar screen', meals: 'Meal planner', chores: 'Chores screen', reminders: 'Home and renewals screen', smart: 'Smart home setup', more: 'More menu' };
  function go(t) {
    if (t === 'home') { window.scrollTo(0, 0); return; }
    if (t === 'stock') { openStock(); return; }
    if (t === 'shop') { openSheet('shop'); return; }
    if (t === 'bills') { showBillsPage(); return; }
    if (t === 'chores') { showChoresPage(); return; }
    if (t === 'baby') { showBabyPage(); return; }
    toast((labels[t] || 'This screen') + ' is built next');
  }
  document.querySelectorAll('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { go(b.getAttribute('data-nav')); }); });

  // ---------- Theme toggle ----------
  $('theme').addEventListener('click', function () {
    var root = document.documentElement;
    var dark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-theme', dark ? 'light' : 'dark');
  });

  // ---------- Start ----------
  function renderAll() {
    renderHeader();
    if (!S) return;
    renderSummary(); renderLast(); renderToday(); renderHighlights();
  }
  renderHeader();
  load();
  // Keep in step with what the other person logs
  setInterval(function () { if (!mode && !pageOpen() && !document.hidden) load(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !mode && !pageOpen()) load(); });
})();
</script>
